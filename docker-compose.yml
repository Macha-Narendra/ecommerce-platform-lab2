version: "3.9"

services:

  backend:
    build: .

    container_name: ecommerce-backend

    volumes:
      - .:/app

    env_file:
      - .env
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/swagger/"]
      interval: 30s
      timeout: 10s
      retries: 3

    depends_on:
      - postgres
      - redis
  nginx:

    image: nginx:latest

    container_name: ecommerce-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/app

    depends_on:
      - backend

  postgres:
    image: postgres:16

    container_name: ecommerce-postgres

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecomuser
      POSTGRES_PASSWORD: ecompassword

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7

    container_name: ecommerce-redis


volumes:
  postgres_data:
